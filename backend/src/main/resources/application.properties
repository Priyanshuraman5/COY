spring.datasource.url=jdbc:h2:file:./data/coy;AUTO_SERVER=true
spring.sql.init.mode=always
server.port=8080
server.error.include-message=always
# Demo mode: no SMS provider is wired up, so the OTP is also returned in the API response.
# Set to false when a real SMS gateway (Twilio, MSG91, ...) replaces the console log.
app.dev-otp-in-response=true
app.frontend-url=http://localhost:5173
# Undo window after adding a crush. Nobody is notified and it cannot match until the window ends.
# 30s keeps demos quick; a real product would use 300 to 600.
app.undo-window-seconds=30
# Ghost chat length before it ends unless both people reveal.
app.chat-hours=48
